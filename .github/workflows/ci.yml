name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n hooks/board-register.sh
      - run: shellcheck hooks/board-register.sh
      - run: bash -n hooks/board-check.sh
      - run: shellcheck hooks/board-check.sh
